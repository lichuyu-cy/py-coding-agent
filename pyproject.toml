[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-harness"
version = "0.1.0"
description = "Python coding agent harness: bounded agent loop, tool pipeline, context management, events and recovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "pydantic>=2",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
server = [
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
